openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: runner
    description: Code execution operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /run:
    post:
      operationId: runCode
      tags: [runner]
      summary: Execute Node.js code
      description: Runs the provided Node.js code and returns stdout, stderr, and exit info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunInput"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /snippets:
    get:
      operationId: listSnippets
      tags: [runner]
      summary: List saved snippets
      responses:
        "200":
          description: List of saved snippets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snippet"
    post:
      operationId: createSnippet
      tags: [runner]
      summary: Save a code snippet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnippetInput"
      responses:
        "201":
          description: Created snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snippet"
  /snippets/{id}:
    delete:
      operationId: deleteSnippet
      tags: [runner]
      summary: Delete a saved snippet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RunInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Node.js code to execute
        stdin:
          type: ["string", "null"]
          description: Optional stdin input
    RunResult:
      type: object
      required: [stdout, stderr, exitCode, executionTimeMs]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: ["integer", "null"]
        executionTimeMs:
          type: integer
        timedOut:
          type: boolean
    Snippet:
      type: object
      required: [id, title, code, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        code:
          type: string
        createdAt:
          type: string
          format: date-time
    SnippetInput:
      type: object
      required: [title, code]
      properties:
        title:
          type: string
          minLength: 1
        code:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
